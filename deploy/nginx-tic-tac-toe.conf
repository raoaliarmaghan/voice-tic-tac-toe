# Paste these blocks inside the HTTPS server block (the one with `listen 443 ssl`)
# of /etc/nginx/sites-enabled/aliarmaghan.com, then:
#   sudo nginx -t && sudo systemctl reload nginx

location = /tic-tac-toe { return 301 /tic-tac-toe/; }

location /tic-tac-toe/api/ {
    proxy_pass http://127.0.0.1:8020/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /tic-tac-toe/assets/ {
    alias /home/ali/voice-tic-tac-toe/frontend/dist/assets/;
    expires 30d;
    add_header Cache-Control "public, immutable";
}

location /tic-tac-toe/ {
    alias /home/ali/voice-tic-tac-toe/frontend/dist/;
    index index.html;
    add_header Cache-Control "no-cache";
}
